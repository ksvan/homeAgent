<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeAgent</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --dim: #8b949e; --accent: #7c5cfc; --accent-dim: #4a3a99;
    --danger: #e5534b; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------------- Login / picker view ---------------- */
  #login-view {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dim));
    box-shadow: 0 0 24px rgba(124, 92, 252, 0.45);
  }
  .brand-name { font-size: 15px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
  #user-list { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 480px; }
  .user-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; min-width: 100px; text-align: center; cursor: pointer;
    color: var(--text); font-family: inherit; font-size: 13px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .user-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .user-tile.remembered { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .user-avatar {
    width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 8px;
    background: linear-gradient(135deg, var(--accent-dim), var(--border));
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
  }
  #login-hint { color: var(--dim); font-size: 12px; max-width: 360px; text-align: center; }

  /* ---------------- Chat view ---------------- */
  #chat-view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .agent-mark {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dim));
  }
  .header-title { font-weight: 600; font-size: 13px; letter-spacing: 0.03em; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .conn-dot.online { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .conn-dot.offline { background: var(--danger); }
  .spacer { flex: 1; }
  #switch-user-btn {
    background: var(--border); border: none; color: var(--dim); padding: 5px 10px;
    border-radius: 5px; cursor: pointer; font-size: 11px; font-family: inherit;
  }
  #switch-user-btn:hover { color: var(--text); }

  #thread { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.user { align-self: flex-end; background: var(--accent-dim); color: #fff; border-bottom-right-radius: 3px; }
  .bubble.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .bubble.system { align-self: center; background: none; color: var(--dim); font-size: 11.5px; }

  .confirm-card { align-self: flex-start; max-width: 78%; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 13px; font-size: 13px; }
  .confirm-actions { display: flex; gap: 8px; margin-top: 8px; }
  .confirm-btn { flex: 1; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .confirm-btn.yes { background: var(--ok); color: #06210d; }
  .confirm-btn.no { background: var(--border); color: var(--text); }
  .confirm-btn:disabled { opacity: 0.5; cursor: default; }

  #status-line { padding: 0 16px 6px; min-height: 16px; color: var(--dim); font-size: 11.5px; font-style: italic; }

  #composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  #composer input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
  }
  #composer input:focus { border-color: var(--accent); }
  #composer button {
    background: var(--accent); border: none; color: #fff; padding: 0 18px;
    border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px;
  }
  #composer button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<div id="login-view">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">HomeAgent</div>
  </div>
  <div id="user-list"></div>
  <div id="login-hint">Pick yourself from the household's list to start chatting. No password — access is limited to this home network.</div>
</div>

<div id="chat-view">
  <header>
    <div class="agent-mark"></div>
    <div class="header-title" id="header-title">HomeAgent</div>
    <div class="conn-dot" id="conn-dot"></div>
    <div class="spacer"></div>
    <button id="switch-user-btn">Switch user</button>
  </header>
  <div id="thread"></div>
  <div id="status-line"></div>
  <form id="composer">
    <input id="msg-input" type="text" autocomplete="off" placeholder="Message HomeAgent…" />
    <button id="send-btn" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  'use strict';

  var loginView = document.getElementById('login-view');
  var chatView = document.getElementById('chat-view');
  var userList = document.getElementById('user-list');
  var thread = document.getElementById('thread');
  var statusLine = document.getElementById('status-line');
  var composer = document.getElementById('composer');
  var msgInput = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');
  var connDot = document.getElementById('conn-dot');
  var headerTitle = document.getElementById('header-title');
  var switchUserBtn = document.getElementById('switch-user-btn');

  var ws = null;
  var reconnectAttempts = 0;
  var reconnectTimer = null;
  var currentToken = null;

  function initials(name) {
    return (name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }

  function setConn(state) {
    connDot.className = 'conn-dot ' + state;
  }

  function appendBubble(role, text) {
    var el = document.createElement('div');
    el.className = 'bubble ' + role;
    el.textContent = text;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
    return el;
  }

  function appendConfirmCard(frame) {
    var card = document.createElement('div');
    card.className = 'confirm-card';
    card.dataset.token = frame.token;
    var text = document.createElement('div');
    text.textContent = frame.text;
    card.appendChild(text);
    var actions = document.createElement('div');
    actions.className = 'confirm-actions';
    var yes = document.createElement('button');
    yes.className = 'confirm-btn yes'; yes.type = 'button'; yes.textContent = 'Yes';
    var no = document.createElement('button');
    no.className = 'confirm-btn no'; no.type = 'button'; no.textContent = 'No';
    yes.onclick = function () { respondConfirm(frame.token, 'confirm', card); };
    no.onclick = function () { respondConfirm(frame.token, 'cancel', card); };
    actions.appendChild(yes); actions.appendChild(no);
    card.appendChild(actions);
    thread.appendChild(card);
    thread.scrollTop = thread.scrollHeight;
  }

  function respondConfirm(token, type, card) {
    Array.prototype.forEach.call(card.querySelectorAll('.confirm-btn'), function (b) { b.disabled = true; });
    send({ type: type, token: token });
  }

  function resolveConfirmCard(frame) {
    var card = thread.querySelector('.confirm-card[data-token="' + CSS.escape(frame.token) + '"]');
    if (!card) return;
    var actions = card.querySelector('.confirm-actions');
    if (actions) actions.remove();
    var result = document.createElement('div');
    result.style.marginTop = '6px';
    result.style.color = frame.ok ? 'var(--ok)' : 'var(--danger)';
    result.style.fontSize = '11.5px';
    result.textContent = frame.text;
    card.appendChild(result);
  }

  function setStatus(text) { statusLine.textContent = text || ''; }

  function handleFrame(frame) {
    if (frame.type === 'message') {
      setStatus('');
      appendBubble('agent', frame.text || '(no response)');
    } else if (frame.type === 'status') {
      setStatus(frame.text);
    } else if (frame.type === 'confirm_request') {
      setStatus('');
      appendConfirmCard(frame);
    } else if (frame.type === 'confirm_result') {
      resolveConfirmCard(frame);
    }
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  function connectWS(token) {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws?token=' + encodeURIComponent(token));
    ws.onopen = function () { reconnectAttempts = 0; setConn('online'); };
    ws.onmessage = function (ev) {
      try { handleFrame(JSON.parse(ev.data)); } catch (e) { /* ignore malformed frame */ }
    };
    ws.onclose = function (ev) {
      setConn('offline');
      if (ev.code === 4401) { logout(); return; }
      scheduleReconnect(token);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) { /* already closing */ } };
  }

  function scheduleReconnect(token) {
    if (reconnectTimer) return;
    reconnectAttempts++;
    var delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 15000);
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      if (currentToken === token) connectWS(token);
    }, delay);
  }

  function enterChat(token, name) {
    currentToken = token;
    loginView.style.display = 'none';
    chatView.style.display = 'flex';
    headerTitle.textContent = 'HomeAgent — ' + name;
    setConn('offline');
    connectWS(token);
    msgInput.focus();
  }

  function showLogin() {
    chatView.style.display = 'none';
    loginView.style.display = 'flex';
    if (ws) { try { ws.close(); } catch (e) { /* noop */ } ws = null; }
    currentToken = null;
    loadUsers();
  }

  function logout() {
    localStorage.removeItem('webchat_token');
    showLogin();
  }

  function loadUsers() {
    userList.innerHTML = '';
    var remembered = localStorage.getItem('webchat_last_user_id');
    fetch('/api/users').then(function (r) { return r.json(); }).then(function (data) {
      (data.users || []).forEach(function (u) {
        var tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'user-tile' + (u.id === remembered ? ' remembered' : '');
        var avatar = document.createElement('div');
        avatar.className = 'user-avatar';
        avatar.textContent = initials(u.name);
        var label = document.createElement('div');
        label.textContent = u.name;
        tile.appendChild(avatar);
        tile.appendChild(label);
        tile.onclick = function () { pickUser(u.id); };
        userList.appendChild(tile);
      });
    });
  }

  function pickUser(userId) {
    fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId }),
    }).then(function (r) {
      if (!r.ok) throw new Error('session create failed');
      return r.json();
    }).then(function (data) {
      localStorage.setItem('webchat_token', data.token);
      localStorage.setItem('webchat_last_user_id', data.user_id);
      thread.innerHTML = '';
      enterChat(data.token, data.name);
    }).catch(function () {
      appendBubble('system', 'Could not start a session — please try again.');
    });
  }

  composer.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = msgInput.value.trim();
    if (!text) return;
    appendBubble('user', text);
    setStatus('thinking…');
    send({ type: 'message', text: text });
    msgInput.value = '';
  });

  switchUserBtn.addEventListener('click', function () {
    var token = currentToken;
    if (token) {
      fetch('/api/session', { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } })
        .catch(function () { /* best-effort */ })
        .finally(function () { logout(); });
    } else {
      logout();
    }
  });

  // ---------------- Boot ----------------
  var savedToken = localStorage.getItem('webchat_token');
  if (savedToken) {
    fetch('/api/me', { headers: { Authorization: 'Bearer ' + savedToken } })
      .then(function (r) { if (!r.ok) throw new Error('expired'); return r.json(); })
      .then(function (me) { enterChat(savedToken, me.name); })
      .catch(function () { logout(); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
